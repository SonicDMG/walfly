# fly.toml for the Next.js API. Fly gives this a free https://<app>.fly.dev
# subdomain with automatic HTTPS — no Caddy/Let's-Encrypt setup needed the
# way the self-hosted path (docker-compose.yml + deploy.sh) requires.
#
# Not a single-command deploy — Fly deploys each Dockerfile as its own app,
# so the API and the sidecar (packages/api/sidecar/fly.toml) are two
# separate `fly deploy` runs. Run every command below from the REPO ROOT
# (needed: this is an npm workspace, packages/db must be reachable):
#
#   fly apps create walfly-api              # once — name must be globally unique
#   fly storage create -a walfly-api -p     # free Tigris S3-compatible bucket;
#                                            # save the printed keys, they're
#                                            # not retrievable again
#   fly secrets set -a walfly-api \
#     WALFLY_API_TOKEN=$(openssl rand -hex 32) \
#     WALFLY_WS_SECRET=$(openssl rand -hex 32) \
#     ASTRA_DB_API_ENDPOINT=... ASTRA_DB_APPLICATION_TOKEN=... \
#     LLM_API_KEY=... LLM_MODEL=openai/gpt-oss-20b \
#     SIDECAR_URL=https://walfly-asr.fly.dev \
#     SIDECAR_WS_URL=wss://walfly-asr.fly.dev/v1/stream \
#     S3_REGION=auto \
#     S3_ENDPOINT=<from fly storage create's output> \
#     S3_BUCKET=<from fly storage create's output> \
#     S3_ACCESS_KEY_ID=<from fly storage create's output> \
#     S3_SECRET_ACCESS_KEY=<from fly storage create's output> \
#     S3_PUBLIC_BASE_URL=https://<bucket>.fly.storage.tigris.dev
#   fly deploy --config packages/api/fly.toml
#
# Then deploy the sidecar the same way (its own `fly apps create` first) —
# see packages/api/sidecar/fly.toml. Full runbook in SETUP.md's Deployment
# section.
app = "walfly-api"            # must be globally unique on Fly — rename this
primary_region = "iad"

[build]
  dockerfile = "packages/api/Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
