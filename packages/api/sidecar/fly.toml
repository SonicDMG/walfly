# fly.toml app configuration file for Walfly ASR Microservice
app = "walfly-asr"
primary_region = "iad"

[build]
  dockerfile = "packages/api/sidecar/Dockerfile"

[env]
  PORT = "8888"

[http_service]
  internal_port = 8888
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
