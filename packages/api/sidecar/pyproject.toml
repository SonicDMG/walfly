[project]
name = "walfly-transcription-sidecar"
version = "0.1.0"
description = "Docling ASR sidecar for Walfly — transcribes audio via whisper-turbo"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "docling[asr]>=2.108.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
