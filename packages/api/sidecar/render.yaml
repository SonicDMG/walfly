services:
  - type: web
    name: walfly-asr
    runtime: docker
    dockerfilePath: packages/api/sidecar/Dockerfile
    plan: standard
    region: oregon
    envVars:
      - key: PORT
        value: 8888
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ASR_WORKERS
        value: "2"
      - key: ASR_CPU_THREADS
        value: "2"
      # WALFLY_WS_SECRET must be set in the Render dashboard (shared with the API).
    healthCheckPath: /health
